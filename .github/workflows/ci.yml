name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      heavy:
        description: "Also run 5,000 traces per generator and the full mutation campaign"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  style:
    name: Format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  msrv:
    name: Minimum Rust version (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo check --workspace --all-targets

  test-debug:
    name: Tests (debug, overflow checks on)
    runs-on: ubuntu-latest
    env:
      PROPTEST_CASES: "64"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  test-release:
    name: Tests (release, 512 traces per generator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release --workspace
      - name: Keep coverage figures
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: target/coverage/

  heavy:
    name: Reference run and mutation campaign
    if: github.event_name == 'workflow_dispatch' && inputs.heavy
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: PROPTEST_CASES=5000 cargo test --release --workspace
      - run: python3 scripts/mutation.py | tee mutation.log
      - uses: actions/upload-artifact@v4
        with:
          name: heavy-run
          path: |
            mutation.log
            target/coverage/
