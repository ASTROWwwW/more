name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      heavy:
        description: "Also run 5,000 traces per generator and the full mutation campaign"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  style:
    name: Format and lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Mutation anchors still match the code
        run: python3 scripts/mutation.py --check

  msrv:
    name: Minimum Rust version (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo check --workspace --all-targets

  test-debug:
    name: Tests (debug, overflow checks on)
    runs-on: ubuntu-latest
    env:
      PROPTEST_CASES: "64"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  test-release:
    name: Tests (release, 512 traces per generator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release --workspace
      - name: Keep coverage figures
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: target/coverage/

  isolation:
    name: Ledger under its own user (three users, as root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the process tests as the runner's user
        shell: bash
        run: |
          set -o pipefail
          cargo test -p more-ledgerd --test process --no-run --message-format=json \
            | python3 -c "import sys, json
          for line in sys.stdin:
              m = json.loads(line)
              if m.get('executable') and m.get('target', {}).get('name') == 'process':
                  print(m['executable'])" > process-test-path
          test -s process-test-path
      - name: Ledger, orchestrator and a third user, each under its own user
        shell: bash
        run: |
          set -o pipefail
          sudo "$(cat process-test-path)" --ignored --nocapture --test-threads 1 | tee two-users.log
          grep -q "two users:" two-users.log

  reference:
    name: Reference run (5,000 traces per generator)
    if: github.event_name == 'workflow_dispatch' && inputs.heavy
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: PROPTEST_CASES=5000 cargo test --release --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: reference-run
          path: target/coverage/

  mutation:
    name: Mutation campaign (shard ${{ matrix.shard }} of 4)
    if: github.event_name == 'workflow_dispatch' && inputs.heavy
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # `shell: bash` turns pipefail on: a missed mutant fails the job despite `tee`.
      - shell: bash
        run: python3 scripts/mutation.py --shard=${{ matrix.shard }}/4 | tee mutation-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-${{ matrix.shard }}
          path: mutation-${{ matrix.shard }}.log
