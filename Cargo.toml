[workspace]
members = [
    "crates/identity",
    "crates/ledger",
    "crates/domain",
    "crates/protocol",
    "crates/simulation",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "AGPL-3.0-only"
rust-version = "1.88"

[workspace.dependencies]
more-identity = { path = "crates/identity" }
gpu-ledger = { path = "crates/ledger" }
gpu-domain = { path = "crates/domain" }
gpu-protocol = { path = "crates/protocol" }
gpu-simulation = { path = "crates/simulation" }
proptest = "1"

# Production crates (identity, ledger, domain, protocol) opt in with `[lints] workspace = true`.
# The simulation and the conformance tests are test code and keep the default lints.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# Root package: only carries the conformance tests (tests/properties, tests/scenarios,
# tests/regressions).
[package]
name = "more-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dev-dependencies]
more-identity = { workspace = true, features = ["test-support"] }
gpu-ledger = { workspace = true, features = ["fault-injection"] }
gpu-domain = { workspace = true, features = ["fault-injection"] }
gpu-protocol.workspace = true
gpu-simulation.workspace = true
proptest.workspace = true

[[test]]
name = "properties"
path = "tests/properties/main.rs"

[[test]]
name = "scenarios"
path = "tests/scenarios/main.rs"

[[test]]
name = "regressions"
path = "tests/regressions/main.rs"

[profile.test]
opt-level = 2

[[test]]
name = "security"
path = "tests/security/main.rs"
